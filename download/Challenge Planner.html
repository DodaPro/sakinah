<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Challenge Planner</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;500;600;700&family=Tajawal:wght@400;500;700&display=swap">
<style>
/* Layout: بانر غامق (Challenge with me + اليوم + التقدم + رسالة تشجيع)، شريط أرقام، كارت تايمر، أهداف الكورسات، وتبويبات: اليوم / الخطة / كورساتي / وقت المذاكرة / إنجازاتي. */
:root{
  --bg:#f1f5f3; --surface:#ffffff; --surface2:#eef3f1; --ink:#0f1f1b; --muted:#53655f; --line:#d5e0db;
  --accent:#0a7d5a; --on:#ffffff; --today:#fbf4d3; --todayline:#d9a21b; --warn:#b42318; --warnbg:#fdeceb;
  --hero:#0d2b26; --hero-ink:#f4fbf8; --hero-mute:#9fbdb4; --hero-line:rgba(255,255,255,.16); --gold:#c8f560;
  --k0:#6d4ae6; --k1:#d97a00; --k2:#1b74e4; --k3:#138a5b; --k4:#d6336c; --k5:#0e8fa8; --k6:#d64a1f; --k7:#7a8b12;
  --college:#5b6b86; --other:#a15c9e;
  --f-body:"Tajawal","Segoe UI",Tahoma,system-ui,sans-serif;
  --f-disp:"Readex Pro","Tajawal",Tahoma,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#09120f; --surface:#122019; --surface2:#182a22; --ink:#e8f3ee; --muted:#93aaa1; --line:#264036;
  --accent:#3ddc9c; --on:#04140f; --today:#2a2813; --todayline:#c9962a; --warn:#ff9a8f; --warnbg:#3a1d1b;
  --hero:#123a32; --hero-ink:#f4fbf8; --hero-mute:#a5c5bb; --hero-line:rgba(255,255,255,.18); --gold:#c8f560;
  --k0:#b29bff; --k1:#ffb347; --k2:#6ab0ff; --k3:#5fd9a0; --k4:#ff8fb3; --k5:#5fd3e8; --k6:#ff8f6b; --k7:#cfe052;
  --college:#9db0cf; --other:#d9a0d6; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#09120f; --surface:#122019; --surface2:#182a22; --ink:#e8f3ee; --muted:#93aaa1; --line:#264036;
  --accent:#3ddc9c; --on:#04140f; --today:#2a2813; --todayline:#c9962a; --warn:#ff9a8f; --warnbg:#3a1d1b;
  --hero:#123a32; --hero-ink:#f4fbf8; --hero-mute:#a5c5bb; --hero-line:rgba(255,255,255,.18); --gold:#c8f560;
  --k0:#b29bff; --k1:#ffb347; --k2:#6ab0ff; --k3:#5fd9a0; --k4:#ff8fb3; --k5:#5fd3e8; --k6:#ff8f6b; --k7:#cfe052;
  --college:#9db0cf; --other:#d9a0d6; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;direction:rtl;
  padding-block:18px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.45;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.save{font-size:12px}
.hero{background:var(--hero);color:var(--hero-ink);border-radius:16px;padding:22px;display:flex;gap:20px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.hero .hl{flex:1;min-width:240px;display:flex;flex-direction:column;gap:8px}
.hero h1{margin:0}
.brand{font-family:var(--f-disp);font-weight:700;font-size:42px;line-height:1.1;letter-spacing:-.01em}
.brand em{font-style:normal;color:var(--gold)}
.day{font-family:var(--f-disp);font-weight:600;font-size:22px;line-height:1.3}
.hero .range{color:var(--hero-mute);font-size:13px}
.msg{margin:4px 0 0;font-size:16px;line-height:1.7;max-width:56ch;border-inline-start:3px solid var(--gold);padding-inline-start:12px}
.ring{position:relative;width:120px;height:120px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-disp);font-size:26px;font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.stat b{display:block;font-family:var(--f-disp);font-size:24px;line-height:1.3;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.stat.bad b{color:var(--warn)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.timer{display:flex;flex-wrap:wrap;gap:14px 24px;align-items:center;justify-content:space-between}
.timer .tl{display:flex;flex-direction:column;gap:6px}
.lbl{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.04em}
.clock{font-family:var(--f-disp);font-size:46px;line-height:1;font-variant-numeric:tabular-nums;direction:ltr;text-align:start}
.clock.on{color:var(--accent)}
.timer .tm{display:flex;flex-direction:column;gap:8px;min-width:210px;flex:1;max-width:420px}
.timer .tc{display:flex;flex-direction:column;gap:8px;align-items:stretch;min-width:170px}
.bar{height:8px;background:var(--surface2);border:1px solid var(--line);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c,var(--accent));width:0}
.small{font-size:12.5px;color:var(--muted)}
.small b{color:var(--ink);font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--line);background:var(--surface2);border-radius:9px;padding:6px 14px;font-weight:500}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--on);border-color:var(--accent);font-weight:600}
.btn.stop{background:var(--warn);color:var(--on);border-color:var(--warn);font-weight:600}
.btn.big{padding:10px 20px;font-size:16px}
.btn.danger{color:var(--warn);border-color:var(--warn);background:transparent}
.btn.danger.sure{background:var(--warn);color:var(--on)}
select,input[type=text],input[type=number],input[type=date]{background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:7px 10px;color:var(--ink);max-width:100%}
.goals{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.goal{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;border-top:4px solid var(--c)}
.goal .gt{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.goal b{font-size:15px;overflow-wrap:anywhere}
.goal .gc{font-family:var(--f-disp);font-size:20px;font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;overflow-x:auto}
.tabs button{flex:1;white-space:nowrap;border:0;background:transparent;padding:8px 14px;border-radius:9px;font-weight:500;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--on)}
section.panel{display:flex;flex-direction:column;gap:14px;min-width:0}
h2{font-family:var(--f-disp);font-size:21px;margin:0;font-weight:600;text-wrap:balance}
h3{font-size:12px;letter-spacing:.06em;color:var(--muted);margin:0;font-weight:700}
.nav{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.nav .grow{flex:1;min-width:160px}
.sub{color:var(--muted);font-size:13px}
.list{display:flex;flex-direction:column;gap:8px}
.trow{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;border-inline-start:5px solid var(--c)}
.trow .task{flex:1;min-width:0;font-size:16px}
.cat{flex:none;font-size:11.5px;font-weight:700;color:var(--c);border:1px solid var(--c);border-radius:999px;padding:0 9px;line-height:22px;max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ic{flex:none;width:34px;height:34px;display:grid;place-items:center;border:0;background:transparent;border-radius:8px;color:var(--muted)}
.ic:hover{background:var(--surface2);color:var(--ink)}
.ic svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.task{display:flex;gap:10px;align-items:center;cursor:pointer;position:relative;line-height:1.5}
.task input{position:absolute;opacity:0;width:22px;height:22px;margin:0}
.task .box{flex:none;width:22px;height:22px;border:2px solid var(--c);border-radius:7px;display:grid;place-items:center}
.task input:checked+.box{background:var(--c)}
.task input:checked+.box::after{content:"";width:6px;height:11px;border:solid var(--on);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.task input:focus-visible+.box{outline:2px solid var(--accent);outline-offset:2px}
.task input:checked~.tt{color:var(--muted);text-decoration:line-through}
.task .tt{min-width:0;overflow-wrap:anywhere}
.eform{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--surface2);border:1px dashed var(--accent);border-radius:12px;padding:10px}
.eform input[type=text]{flex:1;min-width:200px}
.add{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.add input[type=text]{flex:1;min-width:180px}
.week{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.dcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.dcard.today{background:var(--today);border-color:var(--todayline)}
.dcard.restd{background:var(--surface2)}
.dcard header{display:flex;justify-content:space-between;align-items:center;gap:8px}
.dcard header button.dn{background:transparent;border:0;padding:0;text-align:start;line-height:1.3}
.dcard header b{font-family:var(--f-disp);font-size:18px}
.dcard header small{display:block;color:var(--muted);font-size:12px}
.pill{font-size:11.5px;font-weight:700;border-radius:999px;padding:0 9px;line-height:22px;border:1px solid var(--line);color:var(--muted)}
.pill.ok{background:var(--accent);color:var(--on);border-color:var(--accent)}
.pill.late{background:var(--warnbg);color:var(--warn);border-color:var(--warn)}
.pill.now{background:var(--todayline);color:#1a1300;border-color:var(--todayline)}
.dcard .trow{padding:6px 8px;border-radius:9px;border-inline-start-width:4px}
.dcard .trow .task{font-size:13.5px}
.dcard .task .box{width:18px;height:18px;border-radius:6px}
.dcard .ic{width:28px;height:28px}
.dcard .cat{display:none}
.chart{display:flex;align-items:flex-end;gap:3px;height:150px;position:relative;padding-top:6px;border-bottom:1px solid var(--line)}
.chart .col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;min-width:0}
.chart .col i{display:block;width:100%;max-width:34px;background:var(--accent);border-radius:5px 5px 0 0;min-height:2px}
.chart .col.hit i{background:var(--k3)}
.chart .col.future i{background:var(--line)}
.chart .tgt{position:absolute;inset-inline:0;border-top:2px dashed var(--todayline);pointer-events:none}
.chart .tgt span{position:absolute;inset-inline-end:0;top:-20px;font-size:11px;color:var(--muted);background:var(--surface);padding:0 4px}
.xlab{display:flex;gap:3px}
.xlab span{flex:1;text-align:center;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:0;overflow:visible;white-space:nowrap}
.catbars{display:flex;flex-direction:column;gap:8px}
.catbars .r{display:grid;grid-template-columns:110px 1fr 90px;gap:10px;align-items:center;font-size:13px}
.catbars .r span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.catbars .r span:last-child{text-align:end;font-variant-numeric:tabular-nums;color:var(--muted)}
.log{display:flex;flex-direction:column}
.log .l{display:grid;grid-template-columns:1fr auto auto auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.log .l:first-child{border-top:0}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.badge{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:2px;background:var(--surface)}
.badge b{font-family:var(--f-disp);font-size:16px;font-weight:600}
.badge span{font-size:12.5px;color:var(--muted)}
.badge.on{border-color:var(--todayline);background:var(--today)}
.badge.off{opacity:.55}
.badge .st{font-size:11.5px;font-weight:700;margin-top:4px}
.badge.on .st{color:var(--k1)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end}
.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);min-width:0}
.f input,.f select{width:100%}
.f.wide{grid-column:1/-1}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.course{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;border-inline-start:5px solid var(--c)}
.course .cmain{flex:1;min-width:220px;display:flex;flex-direction:column;gap:6px}
.course .cmain b{font-size:17px;overflow-wrap:anywhere}
.course .cact{display:flex;flex-wrap:wrap;gap:6px}
.empty{text-align:center;padding:26px 16px;display:flex;flex-direction:column;gap:8px;align-items:center}
.empty b{font-family:var(--f-disp);font-size:18px;font-weight:600}
.toast{position:fixed;inset-inline:0;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;pointer-events:none;z-index:5;padding-inline:16px}
.toast div{background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:520px;text-align:center}
.foot{font-size:12px;color:var(--muted)}
@media (max-width:560px){.hero{padding:16px}.brand{font-size:32px}.ring{width:96px;height:96px}.ring b{font-size:21px}.clock{font-size:40px}.catbars .r{grid-template-columns:80px 1fr 78px}}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .35s}.toast div{animation:up .25s ease-out}@keyframes up{from{transform:translateY(12px);opacity:0}}}

/* ====== ثيمات المظهر (تحدد النظام التلقائي) ====== */
:root[data-theme="light"]{--bg:#f1f5f3;--surface:#ffffff;--surface2:#eef3f1;--ink:#0f1f1b;--muted:#53655f;--line:#d5e0db;--accent:#0a7d5a;--on:#ffffff;--today:#fbf4d3;--todayline:#d9a21b;--warn:#b42318;--warnbg:#fdeceb;--hero:#0d2b26;--hero-ink:#f4fbf8;--hero-mute:#9fbdb4;--hero-line:rgba(255,255,255,.16);--gold:#c8f560;color-scheme:light}
:root[data-theme="dark"]{--bg:#09120f;--surface:#122019;--surface2:#182a22;--ink:#e8f3ee;--muted:#93aaa1;--line:#264036;--accent:#3ddc9c;--on:#04140f;--today:#2a2813;--todayline:#c9962a;--warn:#ff9a8f;--warnbg:#3a1d1b;--hero:#123a32;--hero-ink:#f4fbf8;--hero-mute:#a5c5bb;--hero-line:rgba(255,255,255,.18);--gold:#c8f560;--k0:#b29bff;--k1:#ffb347;--k2:#6ab0ff;--k3:#5fd9a0;--k4:#ff8fb3;--k5:#5fd3e8;--k6:#ff8f6b;--k7:#cfe052;--college:#9db0cf;--other:#d9a0d6;color-scheme:dark}
:root[data-theme="midnight"]{--bg:#0a1220;--surface:#101c30;--surface2:#16253d;--ink:#e6eefb;--muted:#8ba3c1;--line:#24385a;--accent:#4f9cf9;--on:#051524;--today:#132138;--todayline:#3d7dd8;--warn:#ff9a8f;--warnbg:#3a1d1b;--hero:#0e1c33;--hero-ink:#eef5ff;--hero-mute:#9db8dd;--hero-line:rgba(255,255,255,.15);--gold:#ffd66b;--k0:#b29bff;--k1:#ffb347;--k2:#6ab0ff;--k3:#5fd9a0;--k4:#ff8fb3;--k5:#5fd3e8;--k6:#ff8f6b;--k7:#cfe052;--college:#9db0cf;--other:#d9a0d6;color-scheme:dark}
:root[data-theme="sand"]{--bg:#f8f3e9;--surface:#fffdf8;--surface2:#f3ecdd;--ink:#2b2114;--muted:#7d6f57;--line:#e4d9c2;--accent:#a9720d;--on:#ffffff;--today:#f7ecd2;--todayline:#c9962a;--warn:#b42318;--warnbg:#fdeceb;--hero:#33270f;--hero-ink:#fdf7ea;--hero-mute:#cbb98f;--hero-line:rgba(255,255,255,.16);--gold:#e8b923;color-scheme:light}
:root[data-theme="violet"]{--bg:#f6f4fb;--surface:#ffffff;--surface2:#efeaf8;--ink:#221633;--muted:#6b5f85;--line:#ded4ee;--accent:#7048c8;--on:#ffffff;--today:#f1ebfb;--todayline:#9a6ff0;--warn:#b42318;--warnbg:#fdeceb;--hero:#2a1a4a;--hero-ink:#f6f1ff;--hero-mute:#b7a3dd;--hero-line:rgba(255,255,255,.16);--gold:#e9c6ff;color-scheme:light}
:root[data-theme="rose"]{--bg:#fdf4f6;--surface:#fffafa;--surface2:#f9e8ec;--ink:#331520;--muted:#8a5f6e;--line:#f0d4dc;--accent:#c22e5f;--on:#ffffff;--today:#fbe9ef;--todayline:#e0628c;--warn:#b42318;--warnbg:#fdeceb;--hero:#3d1226;--hero-ink:#fff0f5;--hero-mute:#dfa3b8;--hero-line:rgba(255,255,255,.16);--gold:#ffd3e0;color-scheme:light}
:root[data-theme="sea"]{--bg:#eef7f8;--surface:#ffffff;--surface2:#e2f0f2;--ink:#0c2226;--muted:#4f6e73;--line:#cfe3e6;--accent:#0e7490;--on:#ffffff;--today:#e6f4f6;--todayline:#1993ab;--warn:#b42318;--warnbg:#fdeceb;--hero:#0b2b33;--hero-ink:#eefbfd;--hero-mute:#8fc3cf;--hero-line:rgba(255,255,255,.16);--gold:#7fe3f0;color-scheme:light}
:root[data-theme="ramadan"]{--bg:#150e28;--surface:#1e1440;--surface2:#271b4e;--ink:#f3ecff;--muted:#a894cf;--line:#3b2c66;--accent:#e8b923;--on:#241703;--today:#2b2148;--todayline:#e8b923;--warn:#ff9a8f;--warnbg:#46201c;--hero:#26184d;--hero-ink:#fff7dd;--hero-mute:#c3aef0;--hero-line:rgba(232,185,35,.28);--gold:#ffd76b;--k0:#b29bff;--k1:#ffb347;--k2:#6ab0ff;--k3:#5fd9a0;--k4:#ff8fb3;--k5:#5fd3e8;--k6:#ff8f6b;--k7:#cfe052;--college:#9db0cf;--other:#d9a0d6;color-scheme:dark}
html.no-anims *,html.no-anims *::before,html.no-anims *::after{transition:none!important;animation:none!important}
[hidden]{display:none!important}

/* ====== شريط المواقيت + النقاط + الأذكار ====== */
.xptop{background:linear-gradient(135deg,var(--accent),var(--todayline));color:var(--on);border-radius:999px;padding:3px 12px;font-weight:700;font-size:12.5px;font-variant-numeric:tabular-nums;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.xptop small{font-weight:600;opacity:.9;font-size:11.5px}
.topbtns{display:inline-flex;gap:6px;align-items:center}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.chip{background:var(--hero-line);color:var(--hero-ink);border-radius:999px;padding:3px 12px;font-size:12.5px;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.chip b{font-variant-numeric:tabular-nums}
.pstrip{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:10px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:1px;position:relative}
.pcard .pn{font-size:12.5px;font-weight:700;color:var(--muted)}
.pcard .pt{font-family:var(--f-disp);font-size:19px;font-weight:600;font-variant-numeric:tabular-nums}
.pcard .pc{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}

/* ====== تبويب الصلوات ====== */
.praylist{display:flex;flex-direction:column;gap:8px}

/* ====== نافذة «هل صليت؟» ====== */
.pmask{position:fixed;inset:0;background:rgba(3,10,8,.74);backdrop-filter:blur(5px);display:grid;place-items:center;z-index:50;padding:16px}

.pmodal .mq{font-family:var(--f-disp);font-size:25px;font-weight:700;margin:0 0 4px;line-height:1.5}

.pmodal p{margin:6px 0;line-height:1.85}
.pmodal .pvers{background:var(--surface2);border-radius:12px;padding:12px 14px;font-size:17px;line-height:1.9;margin:12px 0}
.pmodal .pvers small{display:block;color:var(--muted);margin-top:4px;font-size:12px;line-height:1.7}
.pmodal .pbtns{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.pmodal .pbtn{flex:1;min-width:130px;padding:12px;border-radius:12px;font-size:15.5px;font-weight:700;border:1px solid var(--line);background:var(--surface2);color:var(--ink);cursor:pointer}
.pmodal .pbtn.pri{background:var(--accent);border-color:var(--accent);color:var(--on)}

.pmodal .bigcheck{width:76px;height:76px;margin:6px auto 12px;border-radius:50%;background:var(--k3);display:grid;place-items:center;box-shadow:0 0 0 10px var(--surface2)}
.pmodal .xptag{display:inline-block;background:var(--gold);color:#221c02;font-weight:700;border-radius:999px;padding:3px 14px;margin-top:8px;font-variant-numeric:tabular-nums}
.pmodal .ptip{text-align:start;font-size:14.5px;line-height:1.85;background:var(--surface2);border-radius:12px;padding:10px 14px;margin:10px 0}
#fwc{position:fixed;inset:0;pointer-events:none;z-index:60}

/* ====== الإعدادات: الثيمات ====== */
.themegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px}
.tcard{border:2px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;background:var(--surface);cursor:pointer;align-items:flex-start;color:var(--ink)}
.tcard.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.tcard .sw{display:flex;gap:4px}
.tcard .sw i{width:18px;height:18px;border-radius:6px;border:1px solid rgba(0,0,0,.14);display:block}
.tcard b{font-size:13.5px}
@media (max-width:560px){.wg-r{grid-template-columns:86px repeat(5,1fr)}.dhikr .dz{font-size:19px}}

<script>
(function(){
const MONTHS=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
const WD=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2])};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
const utc=s=>{const a=s.split('-').map(Number);return Date.UTC(a[0],a[1]-1,a[2])};
const diff=(a,b)=>Math.round((utc(b)-utc(a))/864e5);
const dm=s=>{const d=parse(s);return d.getDate()+' '+MONTHS[d.getMonth()]};
const dayName=s=>WD[parse(s).getDay()];
const fx=s=>String(s).replace(/([A-Za-z0-9])([#+]+)(?![#+‎])/g,'$1$2‎').replace(/(^|\s)\.(?=[A-Za-z])/g,'$1‎.');
const escA=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const esc=t=>escA(fx(t));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const validDate=s=>/^\d{4}-\d{2}-\d{2}$/.test(s)&&!isNaN(parse(s).getTime());

let TODAY=iso(new Date());
const LS='planner-v1';
const freshState=()=>({cfg:{start:TODAY,days:15,rest:-1,dream:''},courses:[],tasks:[],log:[],timer:null,target:180});
let S=freshState();
function loadInto(r){
  if(!r||!r.cfg)return false;
  S={cfg:Object.assign({start:TODAY,days:15,rest:-1,dream:''},r.cfg),courses:r.courses||[],tasks:r.tasks||[],log:r.log||[],timer:r.timer||null,target:r.target==null?180:r.target};
  return true;
}
try{loadInto(JSON.parse(localStorage.getItem(LS)||'null'))}catch(e){}

let START,END,N,DAYS;
function setDays(){
  START=validDate(S.cfg.start)?S.cfg.start:TODAY;
  N=Math.min(90,Math.max(1,parseInt(S.cfg.days)||15));
  DAYS=[];for(let i=0;i<N;i++)DAYS.push(addDays(START,i));
  END=DAYS[N-1];
}
setDays();
const clampDay=s=>s<START?START:(s>END?END:s);
const isRest=d=>S.cfg.rest>=0&&parse(d).getDay()===S.cfg.rest;

const FIXED={college:{n:'الكلية',v:'--college'},other:{n:'حاجة تانية',v:'--other'}};
function catInfo(id){
  const c=S.courses.find(x=>x.id===id);
  if(c)return{n:c.name,v:'--k'+(c.ci%8)};
  return FIXED[id]||FIXED.other;
}
const cv=id=>'var('+catInfo(id).v+')';
const catIds=()=>S.courses.map(c=>c.id).concat(['college','other']);
const validCat=id=>catIds().indexOf(id)>=0?id:(S.courses[0]?S.courses[0].id:'other');
const catOpts=sel=>catIds().map(id=>'<option value="'+escA(id)+'"'+(id===sel?' selected':'')+'>'+esc(catInfo(id).n)+'</option>').join('');
const dateOpts=sel=>DAYS.map((d,i)=>'<option value="'+d+'"'+(d===sel?' selected':'')+'>يوم '+(i+1)+' · '+dayName(d)+' '+dm(d)+'</option>').join('');

let UI={tab:S.courses.length?'today':'courses',day:clampDay(TODAY),adding:null,confirm:null,confirmReset:false,tcat:''};
try{const t=localStorage.getItem('planner-tab');if(t)UI.tab=t}catch(e){}
let E=null,D={title:'',cat:''},M={date:clampDay(TODAY),min:'60',cat:''};
let CF={id:null,name:'',unit:'فيديو',total:'',from:'1',to:''};
let SF=null;

const tasksOn=d=>S.tasks.filter(t=>t.date===d);
const dayComplete=d=>{const ts=tasksOn(d);return ts.length>0&&ts.every(t=>t.done)};
function fmt(secs){
  secs=Math.max(0,Math.round(secs));const h=Math.floor(secs/3600),m=Math.floor((secs%3600)/60);
  if(h&&m)return h+' س '+m+' د';if(h)return h+' س';if(m)return m+' د';return secs?'أقل من دقيقة':'0 د';
}
function clock(secs){secs=Math.max(0,Math.floor(secs));const h=Math.floor(secs/3600),m=Math.floor((secs%3600)/60),s=secs%60;return h+':'+pad(m)+':'+pad(s)}

/* ---------- توزيع الكورسات ---------- */
function courseDates(c){
  const from=Math.max(1,Math.min(N,parseInt(c.from)||1)),to=Math.max(from,Math.min(N,parseInt(c.to)||N));
  let ds=DAYS.slice(from-1,to);
  const nr=ds.filter(d=>!isRest(d));
  return nr.length?nr:ds;
}
function distribute(c){
  S.tasks=S.tasks.filter(t=>!(t.cat===c.id&&t.gen&&!t.done));
  const kept=S.tasks.filter(t=>t.cat===c.id&&t.gen).reduce((a,t)=>a+(t.qty||1),0);
  const rem=c.total-kept;
  if(rem<=0)return 0;
  let ds=courseDates(c);
  const fut=ds.filter(d=>d>=TODAY);
  if(fut.length)ds=fut;
  const n=ds.length;let u=kept+1;
  for(let i=0;i<n;i++){
    const q=Math.floor((i+1)*rem/n)-Math.floor(i*rem/n);
    if(q<=0)continue;
    if(q<=5){
      for(let j=0;j<q;j++){S.tasks.push({id:'g'+uid(),date:ds[i],title:c.name+' · '+c.unit+' '+u+' من '+c.total,cat:c.id,qty:1,gen:true,done:false});u++}
    }else{
      S.tasks.push({id:'g'+uid(),date:ds[i],title:c.name+' · '+c.unit+' '+u+'–'+(u+q-1)+' من '+c.total,cat:c.id,qty:q,gen:true,done:false});u+=q;
    }
  }
  return rem;
}
function courseStat(c){
  const l=S.tasks.filter(t=>t.cat===c.id&&t.qty);
  return{d:l.filter(t=>t.done).reduce((a,t)=>a+t.qty,0),t:l.reduce((a,t)=>a+t.qty,0)};
}

/* ---------- وقت المذاكرة ---------- */
function splitSession(a,b){
  const out=[];let s=a;
  while(s<b){const d=new Date(s);const nm=new Date(d.getFullYear(),d.getMonth(),d.getDate()+1).getTime();const e=Math.min(b,nm);out.push({date:iso(d),secs:(e-s)/1000});s=e}
  return out;
}
function runningOn(d){if(!S.timer)return 0;return splitSession(S.timer.start,Date.now()).filter(x=>x.date===d).reduce((a,x)=>a+x.secs,0)}
function secsOn(d){return S.log.filter(l=>l.date===d).reduce((a,l)=>a+l.secs,0)+runningOn(d)}
function totalSecs(){return DAYS.reduce((a,d)=>a+secsOn(d),0)}

/* ---------- مقاييس وإنجازات ---------- */
function metrics(){
  const m={total:S.tasks.length,done:S.tasks.filter(t=>t.done).length};
  m.pct=m.total?Math.round(m.done/m.total*100):0;
  m.fullDays=DAYS.filter(dayComplete).length;
  let run=0,best=0;
  DAYS.forEach(d=>{if(d>TODAY)return;if(dayComplete(d)){run++;if(run>best)best=run}else if(d!==TODAY)run=0});
  m.cur=run;m.best=best;
  m.overdue=S.tasks.filter(t=>t.date<TODAY&&!t.done).length;
  m.study=totalSecs();
  m.units=S.tasks.filter(t=>t.done&&t.qty).reduce((a,t)=>a+t.qty,0);
  m.courseDone=S.courses.some(c=>{const s=courseStat(c);return s.t>0&&s.d===s.t});
  return m;
}
const BADGES=[
  {id:'first',n:'أول خطوة',d:'علّم أول مهمة',f:m=>m.done>=1},
  {id:'day',n:'يوم كامل',d:'خلّص كل مهام يوم واحد',f:m=>m.fullDays>=1},
  {id:'h1',n:'أول ساعة',d:'ذاكر ساعة بالتايمر',f:m=>m.study>=3600},
  {id:'s3',n:'3 أيام ورا بعض',d:'3 أيام كاملة متتالية',f:m=>m.best>=3,when:()=>N>=3},
  {id:'u10',n:'10 وحدات',d:'خلّص 10 فيديوهات أو محاضرات أو دروس',f:m=>m.units>=10},
  {id:'h10',n:'10 ساعات مذاكرة',d:'مجموع وقت التايمر',f:m=>m.study>=36000},
  {id:'half',n:'نص الطريق',d:'50% من مهام التحدي',f:m=>m.pct>=50},
  {id:'w7',n:'7 أيام كاملة',d:'أي 7 أيام خلصت فيهم كل المهام',f:m=>m.fullDays>=7,when:()=>N>=7},
  {id:'u50',n:'50 وحدة',d:'خلّص 50 وحدة من كورساتك',f:m=>m.units>=50},
  {id:'h25',n:'25 ساعة مذاكرة',d:'مجموع وقت التايمر',f:m=>m.study>=90000},
  {id:'course',n:'أول كورس خلص',d:'خلّص كورس كامل من كورساتك',f:m=>m.courseDone},
  {id:'all',n:'التحدي كله',d:'كل مهام التحدي',f:m=>m.total>0&&m.done===m.total},
  {id:'pday',n:'خمس صلوات',d:'صليت الخمس صلوات في يوم واحد',f:()=>window.prayerStat?window.prayerStat().full>=1:false,when:()=>!!window.prayerStat},
  {id:'pfajr',n:'صاحب الفجر',d:'7 أيام صليت فيها الفجر',f:()=>window.prayerStat?window.prayerStat().fajrDays>=7:false,when:()=>!!window.prayerStat},
  {id:'p50',n:'50 صلاة',d:'إجمالي 50 صلاة مؤدية',f:()=>window.prayerStat?window.prayerStat().total>=50:false,when:()=>!!window.prayerStat},
  {id:'pstreak',n:'التزام 3 أيام',d:'3 أيام متتالية بالخمس صلوات',f:()=>window.prayerStat?window.prayerStat().best>=3:false,when:()=>!!window.prayerStat}
];
const activeBadges=()=>BADGES.filter(b=>!b.when||b.when());
const unlocked=()=>{const m=metrics();return activeBadges().filter(b=>b.f(m)).map(b=>b.id)};

const GEN=[
 'أصعب حاجة البداية، وإنت بدأت. خد أول مهمة وخلّصها.',
 'الاستمرار أهم من الكمية. شوية كل يوم هيوصّلوك.',
 'كل مهمة بتعلّمها هي خطوة حقيقية ناحية هدفك.',
 'لو يومك تقيل، اعمل أصغر مهمة. أحسن من صفر.',
 'بص وراك: إنت عملت أكتر مما تتخيل.',
 'ركّز في اللي قدامك النهارده بس، وبكرة له يومه.',
 'عدّيت نص الطريق تقريبًا. إنك تكمّل أسهل من إنك تبدأ من الأول.',
 'جرّب تطبّق اللي اتعلمته بإيدك، ده اللي بيثبّت المعلومة.',
 'كل ساعة مذاكرة بتتحسب، حتى لو صغيرة.',
 'قربت جدًا. شدّ حيلك.',
 'خطوة كمان وتخلص. ركّز.',
 'آخر لفّة! جهّز نفسك لاحتفال صغير بعد ما تخلص.'
];
function heroMsg(m){
  if(!S.courses.length&&!S.tasks.length)return 'ضيف كورساتك في تبويب «كورساتي» وأنا هقسمها على أيام التحدي.';
  const idx=diff(START,TODAY);
  if(TODAY<START)return 'التحدي لسه ما بدأش. جهّز الكورسات والمكان اللي هتذاكر فيه.';
  if(TODAY>END)return m.total>0&&m.done===m.total?'خلصت التحدي كله. عملت حاجة كبيرة بجد.':'التحدي خلص. شوف اللي فاضل وكمّله، وكل ساعة بتتحسب.';
  const ts=tasksOn(TODAY);
  if(ts.length&&ts.every(t=>t.done))return 'خلصت مهام النهارده. ارتاح، واللي بتعمله كل يوم هو اللي بيوصّلك.';
  if(m.overdue>0)return 'في '+m.overdue+' مهمة متأخرة. مفيش مشكلة، ابدأ بأصغر واحدة، أو اضغط «وزّع الباقي من النهارده» في تبويب كورساتي.';
  return GEN[Math.min(GEN.length-1,Math.max(0,Math.floor(idx/N*GEN.length)))];
}

/* ---------- رسم ---------- */
function ringSvg(p,track,fill){
  const C=2*Math.PI*45,off=C*(1-p/100);
  return '<svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="45" fill="none" stroke="'+track+'" stroke-width="9"/><circle cx="50" cy="50" r="45" fill="none" stroke="'+fill+'" stroke-width="9" stroke-linecap="round" stroke-dasharray="'+C.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'"/></svg>';
}

function vStudy(){
  const tgt=S.target*60,total=totalSecs();
  const elapsed=DAYS.filter(d=>d<=TODAY).length||1;
  const per=DAYS.map(d=>secsOn(d));
  const best=Math.max.apply(null,per);
  const bi=per.indexOf(best);
  const hit=DAYS.filter((d,i)=>tgt>0&&per[i]>=tgt).length;
  const mx=Math.max(tgt,best,600);
  const cols=DAYS.map((d,i)=>'<div class="col'+(tgt>0&&per[i]>=tgt?' hit':'')+(d>TODAY?' future':'')+'" title="يوم '+(i+1)+': '+fmt(per[i])+'"><i style="height:'+Math.round(per[i]/mx*100)+'%"></i></div>').join('');
  const step=Math.ceil(N/15);
  const labs=DAYS.map((d,i)=>'<span>'+(i%step===0?(i+1):'')+'</span>').join('');
  const tl=tgt>0?'<div class="tgt" style="bottom:'+(tgt/mx*100)+'%"><span>هدف '+fmt(tgt)+'</span></div>':'';
  const catS={};catIds().forEach(k=>catS[k]=0);
  const addC=(k,s)=>{const id=catS[k]==null?'other':k;catS[id]+=s};
  S.log.forEach(l=>{if(DAYS.indexOf(l.date)>=0)addC(l.cat,l.secs)});
  if(S.timer){splitSession(S.timer.start,Date.now()).forEach(x=>{if(DAYS.indexOf(x.date)>=0)addC(S.timer.cat,x.secs)})}
  const cm=Math.max.apply(null,Object.keys(catS).map(k=>catS[k]).concat([1]));
  const catRows=Object.keys(catS).map(k=>'<div class="r"><span>'+esc(catInfo(k).n)+'</span><div class="bar" style="--c:'+cv(k)+'"><i style="width:'+Math.round(catS[k]/cm*100)+'%"></i></div><span>'+fmt(catS[k])+'</span></div>').join('');
  const logs=S.log.slice().sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id)).slice(0,30);
  const logRows=logs.length?logs.map(l=>{const sure=UI.confirm==='log:'+l.id;return '<div class="l"><span>'+dayName(l.date)+' '+dm(l.date)+'</span><span class="cat" style="--c:'+cv(l.cat)+'">'+esc(catInfo(l.cat).n)+'</span><b>'+fmt(l.secs)+'</b><button class="btn danger'+(sure?' sure':'')+'" data-dellog="'+escA(l.id)+'">'+(sure?'تأكيد':'مسح')+'</button></div>'}).join(''):'<div class="sub">لسه مفيش جلسات. شغّل التايمر أو ضيف وقت يدوي.</div>';
  return '<h2>وقت المذاكرة</h2>'+
   '<div class="stats"><div class="stat"><b data-live="total">'+fmt(total)+'</b><span>الإجمالي في التحدي</span></div><div class="stat"><b>'+fmt(total/elapsed)+'</b><span>متوسط اليوم</span></div><div class="stat"><b>'+(best?fmt(best):'0 د')+'</b><span>أفضل يوم'+(best?' (يوم '+(bi+1)+')':'')+'</span></div><div class="stat"><b>'+hit+'</b><span>أيام حققت الهدف</span></div></div>'+
   '<div class="card"><h3>الوقت كل يوم (الأخضر = حققت الهدف)</h3><div style="height:12px"></div><div class="chart">'+tl+cols+'</div><div class="xlab">'+labs+'</div></div>'+
   '<div class="card"><h3>الوقت حسب المادة</h3><div style="height:10px"></div><div class="catbars">'+catRows+'</div></div>'+
   '<div class="card"><h3>هدف المذاكرة اليومي</h3><div style="height:8px"></div><div class="add"><label for="s-target">ساعات في اليوم</label><input type="number" id="s-target" min="0" max="16" step="0.5" value="'+(S.target/60)+'" style="width:90px"></div></div>'+
   '<div class="card"><h3>نسيت تشغّل التايمر؟ ضيف وقت يدوي</h3><div style="height:8px"></div><form class="add" id="manf"><select id="m-date" aria-label="اليوم">'+dateOpts(M.date)+'</select><input type="number" id="m-min" min="1" max="720" value="'+escA(M.min)+'" style="width:90px" aria-label="دقائق"><span class="small">دقيقة</span><select id="m-cat" aria-label="المادة">'+catOpts(validCat(M.cat))+'</select><button class="btn pri" type="submit">إضافة الوقت</button></form></div>'+
   '<div class="card"><h3>آخر الجلسات</h3><div style="height:6px"></div><div class="log">'+logRows+'</div></div>';
}

function toggleTask(id,val){
  const t=S.tasks.find(x=>x.id===id);if(!t)return;
  const before=unlocked(),wasFull=dayComplete(t.date);
  t.done=val;
  save();
  if(val&&window.addXP)window.addXP(5,'خلصت مهمة',true);
  const after=unlocked(),msgs=[];
  if(val&&!wasFull&&dayComplete(t.date)){msgs.push('عاش! خلصت يوم '+(diff(START,t.date)+1));if(window.addXP)window.addXP(15,'يوم كامل',true);}
  const nb=activeBadges().filter(b=>after.indexOf(b.id)>=0&&before.indexOf(b.id)<0);
  if(nb.length){msgs.push('إنجاز جديد: '+nb.map(b=>b.n).join('، '));if(window.addXP)window.addXP(20*nb.length,'إنجاز جديد',true)}
  render();
  if(msgs.length)toast(msgs.join(' · '));
}
function stopTimer(){
  const T=S.timer;if(!T)return;
  const before=unlocked(),end=Date.now();
  const parts=splitSession(T.start,end).filter(x=>x.secs>=1);
  const total=parts.reduce((a,x)=>a+x.secs,0);
  S.timer=null;
  if(total<10){save();render();toast('الجلسة قصيرة جدًا فمتسجلتش');return}
  parts.forEach(x=>S.log.push({id:uid(),date:x.date,secs:Math.round(x.secs),cat:validCat(T.cat)}));
  save();
  const after=unlocked(),nb=activeBadges().filter(b=>after.indexOf(b.id)>=0&&before.indexOf(b.id)<0);
  if(nb.length&&window.addXP)window.addXP(20*nb.length,'إنجاز جديد',true);
  if(window.addXP&&total>=600)window.addXP(Math.min(50,Math.floor(total/600)),'جلسة مذاكرة',true);
  render();

/* ---------- حساب المواقيت فلكيًا على جهازك (من غير نت) ---------- */
var rad=function(x){return x*Math.PI/180},deg=function(x){return x*180/Math.PI};
var fixA=function(a){a=a%360;return a<0?a+360:a};
var fixH=function(h){h=h%24;return h<0?h+24:h};
function julian(y,m,d){if(m<=2){y--;m+=12}var A=Math.floor(y/100),B=2-A+Math.floor(A/4);return Math.floor(365.25*(y+4716))+Math.floor(30.6001*(m+1))+d+B-1524.5}
function sunPos(jd){
  var D=jd-2451545.0;
  var g=fixA(357.529+0.98560028*D);
  var q=fixA(280.459+0.98564736*D);
  var L=fixA(q+1.915*Math.sin(rad(g))+0.020*Math.sin(rad(2*g)));
  var e=23.439-0.00000036*D;
  var RA=deg(Math.atan2(Math.cos(rad(e))*Math.sin(rad(L)),Math.cos(rad(L))))/15;
  var eqt=q/15-RA;if(eqt>12)eqt-=24;if(eqt<-12)eqt+=24;
  var decl=deg(Math.asin(Math.sin(rad(e))*Math.sin(rad(L))));
  return{decl:decl,eqt:eqt};
}
function angleT(angle,decl,lat){
  var c=(-Math.sin(rad(angle))-Math.sin(rad(decl))*Math.sin(rad(lat)))/(Math.cos(rad(decl))*Math.cos(rad(lat)));
  if(c>1||c<-1)return NaN;
  return deg(Math.acos(c))/15;
}
function timesFor(date){
  var lat=+I.set.lat,lng=+I.set.lng,tz=-date.getTimezoneOffset()/60;
  var jd=julian(date.getFullYear(),date.getMonth()+1,date.getDate())-lng/360+0.5;
  var sp=sunPos(jd);
  var dhuhr=12+tz-lng/15-sp.eqt;
  var M=METHODS[I.set.method]||METHODS.egypt;
  var t={};
  t.fajr=dhuhr-angleT(M.fajr,sp.decl,lat);
  t.sunrise=dhuhr-angleT(0.833,sp.decl,lat);
  t.dhuhr=dhuhr;
  var asrAng=deg(Math.atan(1/((+I.set.asr||1)+Math.tan(rad(Math.abs(lat-sp.decl))))));
  t.asr=dhuhr+angleT(-asrAng,sp.decl,lat);
  t.maghrib=dhuhr+angleT(0.833,sp.decl,lat);
  t.isha=(M.isha==='90m')?(t.maghrib+1.5):(dhuhr+angleT(M.isha,sp.decl,lat));
  for(var k in t)t[k]=fixH(t[k]);
  return t;
}
function fmtT(h){
  if(isNaN(h))return '--:--';
  var H=Math.floor(h+1e-9),M=Math.round((h-H)*60);
  if(M===60){H=(H+1)%24;M=0}
  var ap=H<12?'ص':'م',h12=((H+11)%12)+1;
  return h12+':'+pad2(M)+' '+ap;
}
function hms(ms){ms=Math.max(0,ms);var s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor((s%3600)/60),ss=s%60;return(h?h+':':'')+pad2(m)+':'+pad2(ss)}

function countYes(r){var c=0;if(r)for(var i=0;i<OBL.length;i++)if(r[OBL[i][0]]==='yes')c++;return c}
function prayerStat(){
  var full=0,total=0,fajrDays=0,best=0,run=0,prevT=0;
  var dates=Object.keys(I.prayers).sort();
  dates.forEach(function(ds){
    var p=ds.split('-'),tt=new Date(+p[0],+p[1]-1,+p[2]).getTime();
    if(prevT&&tt-prevT>86400*1000*1.5)run=0;
    prevT=tt;
    var r=I.prayers[ds],c=countYes(r);
    total+=c;
    if(r.fajr==='yes')fajrDays++;
    if(c===5){full++;run++;if(run>best)best=run}else run=0;
  });
  var cur=0,d=new Date();
  if(countYes(getRec(todayKey()))<5)d.setDate(d.getDate()-1);
  for(;;){
    var c=countYes(getRec(d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate())));
    if(c===5){cur++;d.setDate(d.getDate()-1)}else break;
  }
  return{full:full,total:total,fajrDays:fajrDays,best:best,cur:cur};
}

var audioReady=false,audioEl=null;
function audio(){if(!audioEl)audioEl=$('#azanAudio');return audioEl}
function unlockAudio(){
  var a=audio();if(!a)return;
  try{
    if(!window._ac)window._ac=new(window.AudioContext||window.webkitAudioContext)();
    if(window._ac.resume)window._ac.resume();
  }catch(e){}
  try{
    a.volume=0;
    if(!a.src)a.src=(MUEZZIN[I.set.muezzin]||MUEZZIN.makka).url;
    var p=a.play();
    if(p&&p.then)p.then(function(){a.pause();a.currentTime=0;audioReady=true;updateSoundBtn()}).catch(function(){});
  }catch(e){}
}
document.addEventListener('pointerdown',function(){if(!audioReady)unlockAudio()},{once:true});
function chime(){
  try{
    var ac=window._ac||new(window.AudioContext||window.webkitAudioContext)();window._ac=ac;
    if(ac.resume)ac.resume();
    var t=ac.currentTime,v=Math.max(.05,+I.set.vol||.8);
    [[880,0],[1108.7,.35],[1318.5,.7]].forEach(function(f){
      var o=ac.createOscillator(),g=ac.createGain();
      o.type='sine';o.frequency.value=f[0];
      g.gain.setValueAtTime(0,t+f[1]);
      g.gain.linearRampToValueAtTime(.35*v,t+f[1]+.05);
      g.gain.exponentialRampToValueAtTime(.001,t+f[1]+1.2);
      o.connect(g);g.connect(ac.destination);o.start(t+f[1]);o.stop(t+f[1]+1.3);
    });
  }catch(e){}
}
function notify(title,body){
  try{if('Notification'in window&&Notification.permission==='granted')new Notification(title,{body:body})}catch(e){}
}
function playAdhan(){
  if(!I.set.adhan){chime();return}
  var a=audio();
  if(audioReady&&a){
    try{
      a.src=(MUEZZIN[I.set.muezzin]||MUEZZIN.makka).url;
      a.volume=Math.max(0,Math.min(1,+I.set.vol||.8));
      var p=a.play();
      if(p&&p.catch)p.catch(function(){chime();notify('حان وقت الصلاة','حي على الصلاة')});
      return;
    }catch(e){}
  }
  chime();
  notify('حان وقت الصلاة','حي على الصلاة');
}

/* ---------- الألعاب النارية ---------- */
function fireworks(){
  if(!I.set.anims)return;
  var c=$('#fwc');if(!c)return;
  var ctx=c.getContext('2d');
  c.hidden=false;c.width=window.innerWidth;c.height=window.innerHeight;
  var colors=['#ffd76b','#3ddc9c','#ff8fb3','#6ab0ff','#ffffff','#e8b923'];
  var parts=[],start=Date.now(),bursts=0;
  (function frame(){
    ctx.clearRect(0,0,c.width,c.height);
    if(bursts<6&&(Math.random()<.18||bursts<2)){
      var x=c.width*(.15+Math.random()*.7),y=c.height*(.15+Math.random()*.45);
      var n=50+Math.random()*40|0;
      for(var i=0;i<n;i++){
        var a=Math.random()*Math.PI*2,s=1.5+Math.random()*4.5;
        parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,age:0,life:50+Math.random()*45,c:colors[Math.random()*colors.length|0],r:1.2+Math.random()*2.4});
      }
      bursts++;
    }
    parts=parts.filter(function(p){return p.age<p.life});
    for(var j=0;j<parts.length;j++){
      var p2=parts[j];p2.age++;p2.x+=p2.vx;p2.y+=p2.vy;p2.vy+=.045;p2.vx*=.985;p2.vy*=.985;
      ctx.globalAlpha=Math.max(0,1-p2.age/p2.life);
      ctx.fillStyle=p2.c;ctx.beginPath();ctx.arc(p2.x,p2.y,p2.r,0,7);ctx.fill();
    }
    ctx.globalAlpha=1;
    if(Date.now()-start<3200||parts.length)requestAnimationFrame(frame);
    else{ctx.clearRect(0,0,c.width,c.height);c.hidden=true}
  })();
}

   '<div style="height:12px"></div><div class="add"><label for="i-accent">لون مخصص من اختيارك:</label><input type="color" id="i-accent" value="'+(I.set.accent||'#0a7d5a')+'"><button class="btn" data-iact="clear-accent" type="button">الغاء اللون المخصص</button></div></div>'+
   '<div class="card"><h3>الحركات والأنميشن</h3><div style="height:8px"></div><label class="task" style="cursor:pointer;--c:var(--accent)"><input type="checkbox" id="i-anims"'+(I.set.anims?' checked':'')+'><span class="box"></span><span class="tt">تفعيل الأنميشنات (الألعاب النارية والحركات)</span></label></div>'+
   '<div class="card"><h3>صوت الأذان</h3><div style="height:8px"></div>'+
   '<label class="task" style="cursor:pointer;--c:var(--accent)"><input type="checkbox" id="i-adhan"'+(I.set.adhan?' checked':'')+'><span class="box"></span><span class="tt">تشغيل الأذان عند وقت كل صلاة</span></label>'+
   '<div class="add" style="margin-top:10px"><label for="i-muez">المؤذن</label><select id="i-muez">'+muezOpts+'</select>'+
   '<label for="i-vol">مستوى الصوت</label><input type="range" id="i-vol" min="0" max="1" step="0.05" value="'+(+I.set.vol)+'">'+
   '<button class="btn pri" data-iact="test-azan" type="button">جرّب الأذان</button>'+
   (audioReady?'':'<button class="btn" data-iact="unlock" type="button">تفعيل الصوت بالمتصفح</button>')+
   '<button class="btn" data-iact="demo-modal" type="button">جرّب نافذة الصلاة</button></div>'+
   '<div class="sub" style="margin-top:8px">لو الأذان مش شغال: دوس «تفعيل الصوت بالمتصفح» مرة واحدة — المتصفحات بتمنع الصوت لحد ما تدوس حاجة في الصفحة.</div></div>'+
   '<div class="card"><h3>حساب المواقيت</h3><div style="height:8px"></div><div class="fgrid">'+
   '<label class="f">طريقة الحساب<select id="i-method">'+methodOpts+'</select></label>'+

};
function iact(a){
  if(a==='clear-accent'){I.set.accent='';saveI();applyTheme();refreshIfPrayerTab()}
  else if(a==='test-azan'){
    unlockAudio();
    setTimeout(function(){
      var el=audio();
      try{
        el.src=(MUEZZIN[I.set.muezzin]||MUEZZIN.makka).url;
        el.volume=Math.max(0,Math.min(1,+I.set.vol||.8));
        var p=el.play();
        if(p&&p.catch)p.catch(function(){chime();toastMsg('الصوت مقفول من المتصفح — دوس «تفعيل الصوت بالمتصفح»')});
        setTimeout(function(){try{el.pause()}catch(e){}},15000);
        toastMsg('ده جزء من الأذان — هيتشغل كامل عند وقت الصلاة');
      }catch(e){chime()}
    },250);
  }
  else if(a==='unlock'){
    unlockAudio();
    try{if('Notification'in window&&Notification.permission==='default')Notification.requestPermission()}catch(e){}
    setTimeout(function(){toastMsg(audioReady?'الصوت اتفعّل — الأذان هيشتغل عند الوقت':'المتصفح رفض — جرّب تدوس في أي حتة في الصفحة وأعد المحاولة')},800);
  }
  else if(a==='demo-modal'){
    curKey={k:'dhuhr',name:'الظهر',ds:todayKey(),demo:true};
    modalOpen=true;
    $('#pmodal').innerHTML=askHTML('الظهر','dhuhr');
    $('#pmask').hidden=false;
  }
  else if(a==='save-loc'){
    var la=parseFloat($('#i-lat').value),ln=parseFloat($('#i-lng').value);
    if(isNaN(la)||isNaN(ln)||Math.abs(la)>90||Math.abs(ln)>180){toastMsg('اكتب إحداثيات صحيحة');return}
    I.set.lat=la;I.set.lng=ln;
    I.set.city=($('#i-city').value||'').trim().slice(0,40)||'موقعي';
    saveI();renderStrip();refreshIfPrayerTab();
    toastMsg('اتحفظ الموقع — المواقيت اتحدثت');
  }
  else if(a==='geo'){
    if(!navigator.geolocation){toastMsg('متصفحك مش بيدعم تحديد الموقع');return}
    toastMsg('جاري تحديد موقعك…');
    navigator.geolocation.getCurrentPosition(function(pos){
      I.set.lat=+pos.coords.latitude.toFixed(4);I.set.lng=+pos.coords.longitude.toFixed(4);
      I.set.city='موقعي الحالي';
      saveI();renderStrip();refreshIfPrayerTab();
      toastMsg('تم تحديد موقعك — المواقيت اتحدثت');
    },function(){toastMsg('مش قادر أوصل لموقعك — اكتب الإحداثيات يدوي')},{timeout:10000});
  }
  else if(a==='reset-xp'){
    if(UIRX){I.xp=0;saveI();renderXP();UIRX=false;refreshIfPrayerTab();toastMsg('اتصفّرت النقاط')}
    else{UIRX=true;UIRP=false;refreshIfPrayerTab()}
  }
  else if(a==='reset-prayers'){
    if(UIRP){I.prayers={};I.asked={};saveI();UIRP=false;renderStrip();refreshIfPrayerTab();toastMsg('اتمسح سجل الصلوات')}
    else{UIRP=true;UIRX=false;refreshIfPrayerTab()}
  }
}

/* ---------- ربط الأحداث ---------- */
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-pans]');
  if(el){if(el.dataset.pans==='yes')answerYes();else answerNo();return}
  if(e.target.closest('[data-pgo]')){closeModal();toastMsg('الله يعينك ويثبتك — يلا قوم');return}
  if(e.target.closest('[data-pclose]')){closeModal();return}
  el=e.target.closest('[data-pset]');
  if(el){var a=el.dataset.pset.split('|');manualSet(a[0],a[1],a[2]);return}
  el=e.target.closest('[data-itheme]');
  if(el){I.set.theme=el.dataset.itheme;saveI();applyTheme();refreshIfPrayerTab();return}
  el=e.target.closest('[data-iact]');
  if(el){iact(el.dataset.iact);return}
  if(e.target.closest('[data-dhnext]')){dhIdx++;renderDhikr(true);return}
  if(e.target.closest('#btnSound')){
    unlockAudio();
    try{if('Notification'in window&&Notification.permission==='default')Notification.requestPermission()}catch(e2){}
    return;
  }
  if(e.target.closest('#btnTheme')){
    I.set.theme=isDark()?'light':'dark';
    saveI();applyTheme();
    $('#btnTheme').innerHTML=isDark()?SUN:MOON;
    return;
  }
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.id==='i-anims'){I.set.anims=t.checked;saveI();applyTheme()}
  else if(t.id==='i-adhan'){I.set.adhan=t.checked;saveI()}
  else if(t.id==='i-muez'){I.set.muezzin=t.value;saveI()}
  else if(t.id==='i-method'){I.set.method=t.value;saveI();renderStrip();refreshIfPrayerTab()}
  else if(t.id==='i-asr'){I.set.asr=+t.value;saveI();renderStrip();refreshIfPrayerTab()}
});
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.id==='i-vol'){I.set.vol=+t.value;saveI()}
  else if(t.id==='i-accent'){I.set.accent=t.value;saveI();applyTheme()}
});

/* ---------- العرض بعد كل render من التخطيط ---------- */
window.afterRender=function(){
  renderXP();renderHeroChips();renderStrip();renderDhikr(false);
};

/* ---------- المؤقتات ---------- */
setInterval(function(){
  var np=nextPrayer(),ms=np.at-Date.now();
  var els=document.querySelectorAll('[data-cd-hero],[data-cd-strip]');
  for(var i=0;i<els.length;i++)els[i].textContent=hms(ms);
},1000);
setInterval(checkTriggers,15000);
setInterval(function(){dhIdx++;renderDhikr(true)},60000);
setInterval(function(){
  var el=document.querySelector('[data-dhx]');
  if(el){var s=Math.ceil((dhNext-Date.now())/1000);el.textContent=s<0?0:s}
},1000);
document.addEventListener('visibilitychange',function(){if(!document.hidden)checkTriggers()});

/* ---------- تنظيف السجلات الأقدم من 90 يوم ---------- */
(function(){
  var cut=Date.now()-90*864e5,ch=false;
  Object.keys(I.asked).forEach(function(k){
    var p=k.split('_')[0].split('-');
    if(new Date(+p[0],+p[1]-1,+p[2]).getTime()<cut){delete I.asked[k];ch=true}
  });
  Object.keys(I.prayers).forEach(function(ds){
    var p=ds.split('-');
    if(new Date(+p[0],+p[1]-1,+p[2]).getTime()<cut){delete I.prayers[ds];ch=true}
  });
  if(ch)saveI();
})();

/* ---------- تشغيل ---------- */
applyTheme();
$('#btnTheme').innerHTML=isDark()?SUN:MOON;
updateSoundBtn();
renderXP();
renderDhikr(true);
if(window.plannerRender)window.plannerRender();
checkTriggers();
window.__islam={timesFor:timesFor,nextPrayer:nextPrayer,I:I};
})();
</script>
